name: Blessures NHL ESPN V19
on:
  workflow_dispatch:
  schedule:
    - cron: '12 */3 * * *'
permissions:
  contents: read
jobs:
  injuries:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer les dépendances
        run: python -m pip install -r requirements.txt
      - name: Synchroniser ESPN
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python espn_injuries_v19.py
