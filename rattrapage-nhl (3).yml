
name: Rattrapage historique NHL

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rattrapage:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Recuperer les fichiers
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installer les dependances
        run: python -m pip install 'psycopg[binary]>=3.2,<4' 'requests>=2.31,<3'

      - name: Recuperer les anciens matchs NHL
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python backfill_nhl.py
